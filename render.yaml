services:
  - type: web
    name: whiteboard-interview-simulator
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_EVALUATION_MODEL
        value: gpt-5-mini
      - key: TRIAL_SIGNING_SECRET
        generateValue: true
